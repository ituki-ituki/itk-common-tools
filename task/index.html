<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>タスク</title>
  <link rel="icon" href="/imgs/task.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="/vendor/tw.css" />
  <script defer src="/vendor/alpine.min.js"></script>
  <script src="/base.js?v=2" data-soft="#f5f3ff" data-accent="#8b5cf6" data-deep="#6d28d9"></script>
  <script src="app.js"></script>
</head>
<body class="min-h-screen bg-soft text-ink antialiased" x-data="board()">
  <main class="mx-auto max-w-4xl px-4 py-8">
    <h1 class="mb-6 flex items-center gap-3 text-xl font-bold"><img src="/imgs/task.svg" alt="" width="32" height="32" />タスク</h1>

    <form @submit.prevent="add" class="mb-2 flex gap-2">
      <input x-model="name" placeholder="新しいタスク" class="min-w-0 flex-1 rounded-lg border border-line bg-white px-3 py-2 text-base outline-none focus:border-accent" />
      <button class="rounded-lg bg-accent px-4 py-2 text-sm font-bold text-white disabled:opacity-40" :disabled="!name.trim()"><i class="fa-solid fa-plus mr-1"></i>追加</button>
    </form>
    <p x-show="error" class="mb-2 text-xs text-red-600" x-text="error"></p>

    <div class="overflow-x-auto rounded-lg border border-line bg-white">
      <table class="w-full text-sm">
        <thead class="whitespace-nowrap bg-soft text-left text-xs text-mute">
          <tr>
            <th class="w-12 px-3 py-2 text-center">完了</th>
            <th class="w-14 px-3 py-2">ID</th>
            <th class="min-w-[10rem] px-3 py-2">タスク名</th>
            <th class="px-3 py-2">作成日</th>
            <th class="min-w-[12rem] px-3 py-2">備忘</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="task in tasks" :key="task.id">
            <tr class="border-t border-line">
              <td class="px-3 py-2 text-center"><input type="checkbox" class="h-4 w-4 accent-[#8b5cf6]" @change="finish(task)" /></td>
              <td class="px-3 py-2 tabular-nums text-mute" x-text="task.id"></td>
              <td class="px-3 py-2" x-text="task.name"></td>
              <td class="whitespace-nowrap px-3 py-2 tabular-nums text-mute" x-text="day(task.created)"></td>
              <td class="px-3 py-1"><input x-model="task.memo" @change="note(task)" placeholder="—" class="w-full rounded border border-transparent bg-transparent px-2 py-1 text-base outline-none hover:border-line focus:border-accent sm:text-sm" /></td>
            </tr>
          </template>
          <tr x-show="!tasks.length"><td colspan="5" class="px-3 py-10 text-center text-mute">タスクはありません</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
