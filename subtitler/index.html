<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#dc2626" />
  <title>字幕付き倍速動画</title>
  <link rel="icon" href="../shared/icons/caption.svg" type="image/svg+xml" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <script src="../shared/base.js" data-soft="#fef2f2" data-accent="#dc2626" data-deep="#991b1b"></script>
  <script src="app.js"></script>
</head>
<body class="min-h-screen bg-soft text-ink antialiased">
  <main class="mx-auto max-w-xl px-4 py-12 sm:px-6 sm:py-20" x-data="subtitler()">
    <h1 class="mb-8 flex items-center gap-4 text-2xl font-semibold tracking-tight sm:text-3xl">
      <img src="../shared/icons/caption.svg" alt="" class="h-12 w-12" />字幕付き倍速動画
    </h1>

    <section class="mb-6 rounded-2xl bg-white p-5 ring-1 ring-line">
      <div class="mb-3 flex items-baseline justify-between">
        <span class="font-medium">再生速度</span>
        <span class="text-3xl font-semibold text-accent"><span x-text="speed.toFixed(2)"></span><span class="text-base"> 倍</span></span>
      </div>
      <input type="range" min="1" max="2" step="0.05" x-model.number="speed" :disabled="busy"
        class="h-2 w-full cursor-pointer appearance-none rounded-full bg-line accent-accent" />
      <div class="mt-1 flex justify-between text-xs text-mute"><span>1.0（等倍）</span><span>1.5</span><span>2.0</span></div>
    </section>

    <label class="mb-6 flex min-h-[200px] cursor-pointer flex-col items-center justify-center gap-3 rounded-3xl bg-white px-6 py-12 text-center ring-1 ring-line hover:ring-accent"
      :class="busy && 'pointer-events-none opacity-60'"
      @dragover.prevent @drop.prevent="go($event.dataTransfer.files[0])">
      <input type="file" accept="video/mp4,video/quicktime,.mp4,.mov" class="hidden" @change="go($event.target.files[0]); $event.target.value = ''" />
      <i class="fa-solid fa-film text-5xl text-accent"></i>
      <span class="text-lg font-medium">動画をドロップ、またはクリックして選択</span>
      <span class="text-sm text-mute">AIが字幕を作って焼き込み、指定の速度で書き出します（20分程度まで）</span>
    </label>

    <section x-show="phase" x-cloak class="rounded-2xl bg-white p-5 ring-1 ring-line">
      <div class="mb-2 flex items-center gap-3">
        <i class="fa-solid w-5 text-center" :class="{ busy: 'fa-spinner fa-spin text-accent', done: 'fa-circle-check text-emerald-500', error: 'fa-circle-exclamation text-rose-500' }[phase]"></i>
        <p class="min-w-0 flex-1 truncate text-sm font-medium" x-text="name"></p>
        <span x-show="phase === 'busy'" class="text-sm tabular-nums text-mute" x-text="progress + '%'"></span>
      </div>
      <div x-show="phase === 'busy'" class="h-2 overflow-hidden rounded-full bg-soft">
        <div class="h-full rounded-full bg-accent transition-all duration-500" :style="`width:${progress}%`"></div>
      </div>
      <p class="mt-2 text-xs" :class="phase === 'error' ? 'text-rose-500' : 'text-mute'" x-text="note"></p>
      <a x-show="phase === 'done'" :href="url" class="mt-4 flex items-center justify-center gap-2 rounded-xl bg-accent py-3 text-sm font-medium text-white hover:bg-deep">
        <i class="fa-solid fa-download"></i>ダウンロード
      </a>
    </section>
  </main>
</body>
</html>
