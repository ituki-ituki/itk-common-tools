<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#dc2626" />
  <title>動画変換</title>
  <link rel="icon" href="/imgs/caption.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/vendor/tw.css" />
  <script defer src="/vendor/alpine.min.js"></script>
  <script src="/vendor/mp4box.all.min.js"></script>
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css" />
  <script src="/base.js?v=2" data-soft="#fef2f2" data-accent="#dc2626" data-deep="#991b1b"></script>
  <script src="mux.js"></script>
  <script src="scribe.js"></script>
  <script src="app.js"></script>
</head>
<body class="min-h-screen bg-soft text-ink antialiased">
  <main class="mx-auto max-w-2xl px-4 py-10 sm:px-6 sm:py-16" x-data="studio()">
    <h1 class="mb-8 flex items-center gap-4 text-2xl font-semibold tracking-tight sm:text-3xl">
      <img src="/imgs/caption.svg" alt="" class="h-12 w-12" />動画変換
    </h1>

    <section class="mb-5 rounded-3xl bg-white p-4 ring-1 ring-line sm:p-5">
      <p class="mb-3 text-sm font-medium text-mute">どこまでやる？</p>
      <div class="grid grid-cols-[1fr_auto_1fr_auto_1fr] items-center gap-1 sm:gap-2">
        <template x-for="(m, i) in MODES" :key="m.key">
          <div class="contents">
            <i x-show="i" class="fa-solid fa-chevron-right text-xs" :class="reach(m.key) ? 'text-accent' : 'text-line'"></i>
            <button type="button" @click="mode = m.key"
              class="flex flex-col items-center gap-1.5 rounded-2xl px-1 py-3 transition sm:py-4"
              :class="mode === m.key ? 'bg-accent text-white shadow-lg shadow-accent/30' : reach(m.key) ? 'bg-accent/10 text-accent' : 'bg-soft text-mute hover:text-accent'">
              <i class="fa-solid text-xl sm:text-2xl" :class="m.icon"></i>
              <span class="text-xs font-semibold sm:text-sm" x-text="m.label"></span>
            </button>
          </div>
        </template>
      </div>
      <p class="mt-3 text-xs leading-relaxed text-mute" x-text="current.note"></p>

      <textarea x-show="mode === 'text'" x-model="prompt" rows="3" placeholder="AIへの指示（例：話者をA・Bで区別してください）"
        class="mt-4 w-full rounded-xl bg-soft p-3 text-sm ring-1 ring-line focus:outline-none focus:ring-accent"></textarea>

      <div x-show="mode === 'caption'" class="mt-4">
        <div class="mb-2 flex items-baseline justify-between">
          <span class="text-sm font-medium">再生速度</span>
          <span class="text-2xl font-semibold text-accent"><span x-text="speed.toFixed(2)"></span><span class="text-sm"> 倍</span></span>
        </div>
        <input type="range" min="1" max="2" step="0.05" x-model.number="speed" class="h-2 w-full cursor-pointer appearance-none rounded-full bg-line accent-accent" />
        <div class="mt-1 flex justify-between text-xs text-mute"><span>1.0（等倍）</span><span>1.5</span><span>2.0</span></div>
      </div>
    </section>

    <label class="mb-5 flex min-h-[180px] cursor-pointer flex-col items-center justify-center gap-3 rounded-3xl bg-white px-6 py-10 text-center ring-1 ring-line hover:ring-accent"
      @dragover.prevent @drop.prevent="pick([...$event.dataTransfer.files])">
      <input type="file" accept="video/mp4,video/quicktime,audio/*,.mp4,.m4v,.mov,.m4a" multiple class="hidden"
        @change="pick([...$event.target.files]); $event.target.value = ''" />
      <i class="fa-solid fa-film text-4xl text-accent"></i>
      <span class="text-base font-medium">動画をドロップ、またはクリックして選択</span>
      <span class="text-xs text-mute">MP4 / MOV（複数可）</span>
    </label>

    <ul x-show="jobs.length" x-cloak class="overflow-hidden rounded-2xl bg-white ring-1 ring-line">
      <template x-for="(job, i) in jobs" :key="i">
        <li class="px-5 py-4" :class="i && 'border-t border-line'">
          <div class="flex items-center gap-3">
            <i class="fa-solid w-5 text-center"
              :class="{ busy: 'fa-spinner fa-spin text-accent', done: 'fa-circle-check text-emerald-500', error: 'fa-circle-exclamation text-rose-500' }[job.state]"></i>
            <div class="min-w-0 flex-1">
              <p class="truncate text-sm font-medium" x-text="job.base"></p>
              <p class="text-xs" :class="job.state === 'error' ? 'text-rose-500' : 'text-mute'">
                <i class="fa-solid mr-1" :class="MODES.find((m) => m.key === job.mode).icon"></i><span x-text="job.note"></span>
              </p>
            </div>
            <span x-show="job.progress !== null" class="text-xs tabular-nums text-mute" x-text="job.progress + '%'"></span>
            <button x-show="job.state === 'done'" @click="save(job)" :title="job.out?.ext + ' を保存'"
              class="flex h-10 items-center gap-1 rounded-xl bg-soft px-3 text-xs font-medium text-accent hover:bg-accent hover:text-white">
              <i class="fa-solid fa-download"></i><span x-text="job.out?.ext"></span>
            </button>
          </div>
          <div x-show="job.progress !== null" class="ml-8 mt-2 h-1.5 overflow-hidden rounded-full bg-soft">
            <div class="h-full rounded-full bg-accent transition-all duration-500" :style="`width:${job.progress}%`"></div>
          </div>
        </li>
      </template>
    </ul>

    <p class="mt-6 text-center text-xs text-mute">
      <i class="fa-solid fa-lock mr-1"></i>音声の取り出しは端末内で行います。文字起こし・字幕のときだけ AI に送信します
    </p>
  </main>
</body>
</html>
