<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#6366f1" />
  <title>日程候補リスト作成</title>
  <link rel="icon" href="../shared/icons/calendar.svg" type="image/svg+xml" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ical.js@1.5.0/build/ical.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <script src="../shared/base.js" data-soft="#f5f3ff" data-accent="#6366f1" data-deep="#4338ca"></script>
  <script src="app.js"></script>
  <style>
    .cal-scroll { -webkit-overflow-scrolling: touch; }
    .cal-day { min-width: 4.75rem; }
    @media (min-width: 1024px) {
      .cal-day { min-width: 0; }
    }
  </style>
</head>
<body class="min-h-screen bg-soft text-ink antialiased">
  <main class="mx-auto max-w-6xl px-3 py-8 sm:px-6 sm:py-16" x-data="scheduler()"
    @pointermove.window="onDrag($event)" @pointerup.window="endDrag($event)" @pointercancel.window="cancelDrag()">
    <h1 class="mb-6 flex items-center gap-3 text-2xl font-semibold tracking-tight sm:mb-8 sm:gap-4 sm:text-3xl">
      <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-2xl bg-accent text-white sm:h-12 sm:w-12">
        <i class="fa-solid fa-calendar-days text-base sm:text-lg"></i>
      </span>
      日程候補リスト作成
    </h1>

    <div class="flex flex-col gap-6 lg:flex-row">
      <div class="min-w-0 flex-1">
        <div class="mb-4 flex flex-wrap items-center justify-between gap-2">
          <div class="flex items-center gap-2">
            <button @click="shift(-7)"
              class="flex h-10 w-10 items-center justify-center rounded-xl bg-white text-mute ring-1 ring-line hover:text-accent">
              <i class="fa-solid fa-chevron-left"></i>
            </button>
            <button @click="shift(0)"
              class="h-10 rounded-xl bg-white px-4 text-sm font-medium text-mute ring-1 ring-line hover:text-accent">今週</button>
            <button @click="shift(7)"
              class="flex h-10 w-10 items-center justify-center rounded-xl bg-white text-mute ring-1 ring-line hover:text-accent">
              <i class="fa-solid fa-chevron-right"></i>
            </button>
          </div>
          <div class="text-sm font-semibold sm:text-base" x-text="weekLabel"></div>
        </div>

        <div class="overflow-hidden rounded-2xl bg-white ring-1 ring-line">
          <div class="cal-scroll overflow-x-auto border-b border-line" x-ref="calHead" @scroll="syncCalScroll('head')">
            <div class="flex min-w-[42rem] lg:min-w-0 lg:w-full">
              <div class="sticky left-0 z-20 w-12 shrink-0 bg-white sm:w-14"></div>
              <div class="grid flex-1 grid-cols-7">
                <template x-for="(day, di) in days" :key="di">
                  <div class="cal-day border-l border-line py-2 text-center sm:py-3" :class="isToday(day) ? 'bg-soft' : ''">
                    <div class="text-xs text-mute" x-text="WEEKDAYS[day.getDay()]"></div>
                    <div class="text-base font-semibold sm:text-lg" :class="isToday(day) ? 'text-accent' : ''" x-text="day.getDate()"></div>
                  </div>
                </template>
              </div>
            </div>
          </div>

          <div class="cal-scroll max-h-[70vh] select-none overflow-auto sm:max-h-[600px]" x-ref="calBody"
            x-init="$nextTick(() => $el.scrollTop = 8 * PX_PER_HOUR)" @scroll="syncCalScroll('body')">
            <div class="flex min-w-[42rem] lg:min-w-0 lg:w-full">
              <div class="sticky left-0 z-20 w-12 shrink-0 bg-white sm:w-14">
                <template x-for="h in hours" :key="h">
                  <div class="relative" :class="rule(h)" :style="ROW">
                    <span class="absolute -top-2 right-1 text-[10px] text-mute sm:right-2 sm:text-xs" x-text="h + ':00'"></span>
                    <div class="absolute inset-x-0 border-t border-line/60" :style="HALF"></div>
                  </div>
                </template>
              </div>
              <div class="grid flex-1 grid-cols-7">
                <template x-for="(day, di) in days" :key="di">
                  <div class="cal-day relative border-l border-line [touch-action:manipulation]"
                    @pointerdown="onPointerDown(di, $event)"
                    @mousemove="onHover(di, $event)"
                    @mouseleave="hover = null">
                    <template x-for="h in hours" :key="h">
                      <div class="relative" :class="rule(h)" :style="ROW">
                        <div class="absolute inset-x-0 border-t border-line/60" :style="HALF"></div>
                      </div>
                    </template>
                    <template x-for="b in busyBlocks(di)" :key="b.key">
                      <div class="pointer-events-none absolute inset-x-0.5 overflow-hidden rounded-md bg-slate-400/30 ring-1 ring-slate-400/60 sm:inset-x-1 sm:rounded-lg"
                        :style="b.style">
                        <span class="block truncate px-1 py-0.5 text-[10px] font-medium text-slate-600 sm:px-2 sm:py-1 sm:text-xs" x-text="b.label"></span>
                      </div>
                    </template>
                    <template x-for="c in candidateBlocks(di)" :key="c.id">
                      <div class="pointer-events-none absolute inset-x-0.5 overflow-hidden rounded-md bg-accent/35 ring-1 ring-accent/70 sm:inset-x-1 sm:rounded-lg"
                        :style="c.style">
                        <span class="block truncate px-1 py-0.5 text-[10px] font-medium text-deep sm:px-2 sm:py-1 sm:text-xs" x-text="c.label"></span>
                      </div>
                    </template>
                    <div x-show="!drag && !touchSelect && hover?.dayIndex === di"
                      class="pointer-events-none absolute inset-x-0.5 rounded-md bg-accent/10 ring-1 ring-accent/50 sm:inset-x-1 sm:rounded-lg"
                      :style="hover?.dayIndex === di ? hoverStyle() : ''">
                    </div>
                    <div x-show="selectionDayIndex() === di"
                      class="pointer-events-none absolute inset-x-0.5 rounded-md bg-accent/25 ring-2 ring-accent sm:inset-x-1 sm:rounded-lg"
                      :style="selectionDayIndex() === di ? previewStyle() : ''">
                      <span class="hidden truncate px-2 py-1 text-xs font-medium text-deep sm:block" x-text="previewLabel()"></span>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </div>

        <div class="mt-3 flex items-center justify-between gap-3 text-sm text-mute md:hidden">
          <div class="min-w-0">
            <p x-show="!touchSelect && !drag">開始時刻をタップ → 終了時刻をタップ</p>
            <p x-show="touchSelect || drag">
              <span x-show="touchSelect && !drag">終了時刻をタップ · </span>
              <span class="font-semibold text-accent" x-text="previewLabel()"></span>
            </p>
          </div>
          <button type="button" x-show="touchSelect" @click="cancelTouchSelect()"
            class="shrink-0 rounded-lg bg-white px-3 py-1.5 text-xs font-medium text-mute ring-1 ring-line">
            選択解除
          </button>
        </div>
        <p class="mt-1 text-xs text-mute md:hidden">左右にスワイプで曜日を表示</p>
      </div>

      <aside class="w-full shrink-0 lg:w-80">
        <div class="mb-3 flex items-center justify-between">
          <h2 class="text-lg font-semibold">候補一覧</h2>
          <div class="flex gap-2">
            <button @click="copyAll()" :disabled="!items.length"
              class="flex h-10 w-10 items-center justify-center rounded-xl bg-white text-accent ring-1 ring-line hover:bg-accent hover:text-white disabled:pointer-events-none disabled:opacity-40"
              :title="copied ? 'コピーしました' : 'コピー'">
              <i class="fa-solid" :class="copied ? 'fa-check' : 'fa-copy'"></i>
            </button>
            <button @click="clearAll()" :disabled="!items.length"
              class="flex h-10 w-10 items-center justify-center rounded-xl bg-white text-mute ring-1 ring-line hover:bg-red-500 hover:text-white disabled:pointer-events-none disabled:opacity-40"
              title="全削除">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        </div>
        <p x-show="!items.length" class="rounded-2xl bg-white px-4 py-6 text-center text-sm text-mute ring-1 ring-line">
          まだ候補がありません
        </p>
        <ul x-show="items.length" class="overflow-hidden rounded-2xl bg-white ring-1 ring-line">
          <template x-for="(it, idx) in items" :key="it.id">
            <li class="flex items-center justify-between gap-2 px-4 py-3 text-sm" :class="idx ? 'border-t border-line' : ''">
              <span x-text="it.label"></span>
              <button @click="removeItem(it.id)" class="text-mute hover:text-red-500" title="削除">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </li>
          </template>
        </ul>
      </aside>
    </div>

    <button @click="settingsOpen = !settingsOpen"
      class="fixed right-4 top-4 z-20 flex h-12 w-12 items-center justify-center rounded-full bg-white text-mute shadow-lg ring-1 ring-line hover:text-accent sm:right-6 sm:top-6 sm:h-14 sm:w-14"
      title="自分の予定を重ねる">
      <i class="fa-solid fa-gear text-lg sm:text-xl"></i>
      <span x-show="icsSynced" class="absolute right-1 top-1 h-2.5 w-2.5 rounded-full bg-emerald-500 ring-2 ring-white"></span>
    </button>

    <div x-show="settingsOpen" @click.outside="settingsOpen = false" x-cloak
      class="fixed right-4 top-20 z-20 w-[calc(100vw-2rem)] max-w-80 rounded-2xl bg-white p-5 shadow-xl ring-1 ring-line sm:right-6 sm:top-24">
      <h2 class="mb-3 flex items-center gap-2 text-sm font-semibold text-mute">
        <i class="fa-solid fa-calendar-check"></i>自分の予定を重ねる
      </h2>
      <div class="flex gap-2">
        <input type="url" x-model="icsUrl" placeholder="カレンダーのiCal URL"
          class="min-w-0 flex-1 rounded-xl bg-soft px-3 py-2 text-sm ring-1 ring-line focus:outline-none focus:ring-accent" />
        <button @click="syncIcs(true)" :disabled="!icsUrl || icsLoading"
          class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-white text-accent ring-1 ring-line hover:bg-accent hover:text-white disabled:pointer-events-none disabled:opacity-40"
          title="接続 / 更新">
          <i class="fa-solid" :class="icsLoading ? 'fa-spinner fa-spin' : 'fa-rotate'"></i>
        </button>
        <button @click="disconnectIcs()" x-show="icsUrl"
          class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-white text-mute ring-1 ring-line hover:bg-red-500 hover:text-white"
          title="解除">
          <i class="fa-solid fa-link-slash"></i>
        </button>
      </div>
      <p class="mt-2 text-xs text-red-500" x-show="icsError" x-text="icsError"></p>
      <p class="mt-2 text-xs text-mute" x-show="!icsError && icsSynced" x-text="icsEventCount + '件の予定を取得しました'"></p>
    </div>
  </main>

</body>
</html>
