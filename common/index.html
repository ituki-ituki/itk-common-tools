<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#fafaf9" />
  <title>公開ツール</title>
  <link rel="icon" href="/imgs/tools.svg" type="image/svg+xml" />
  <style>
    *{box-sizing:border-box;margin:0}
    body{min-height:100vh;background:#fafaf9;color:#292524;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
    main{max-width:48rem;margin:0 auto;padding:3rem 1.25rem}
    header{display:flex;align-items:center;gap:.75rem;margin-bottom:2rem}
    h1{font-size:1.125rem;font-weight:600}
    ul{list-style:none;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}
    a{display:flex;height:100%;flex-direction:column;align-items:center;gap:.75rem;border:1px solid #e7e5e4;border-radius:1rem;background:#fff;padding:1.25rem .5rem;text-align:center;color:inherit;text-decoration:none;transition:border-color .15s,box-shadow .15s}
    a:hover{border-color:#d6d3d1;box-shadow:0 1px 2px rgb(0 0 0 / .05)}
    a span{font-size:.75rem;line-height:1.4;color:#44403c;word-break:keep-all}
    .ext{color:#a8a29e}
    @media (min-width:640px){main{padding:4rem 1.25rem}ul{grid-template-columns:repeat(4,1fr)}a span{font-size:.875rem}}
  </style>
</head>
<body>
  <main>
    <header>
      <img src="/imgs/tools.svg" alt="" width="32" height="32" />
      <h1>公開ツール</h1>
    </header>
    <ul>
      <li><a href="totp/"><img src="/imgs/totp.svg" alt="" width="48" height="48" /><span>ワンタイムコード</span></a></li>
      <li><a href="schedule-listing/"><img src="/imgs/calendar.svg" alt="" width="48" height="48" /><span>日程候補​リスト作成</span></a></li>
      <li><a href="degital-card/"><img src="/imgs/card.svg" alt="" width="48" height="48" /><span>デジタル​めいし</span></a></li>
      <li><a href="wine/"><img src="/imgs/wine.svg" alt="" width="48" height="48" /><span>Nosing</span></a></li>
      <li><a href="photo/"><img src="/imgs/photo.svg" alt="" width="48" height="48" /><span>写真の​圧縮・カット</span></a></li>
      <li><a href="line-joiner/"><img src="/imgs/lines.svg" alt="" width="48" height="48" /><span>改行削除</span></a></li>
      <li><a href="https://dify-playground.ai-digitax.com/chat/uvUG6K5wVRH7dCtC" target="_blank" rel="noopener"><img src="/imgs/chat.svg" alt="" width="48" height="48" /><span>会話の​追体験 <span class="ext">↗</span></span></a></li>
    </ul>
  </main>
</body>
</html>
