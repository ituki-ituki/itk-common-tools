<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f172a" />
  <title>Common Tools</title>
  <link rel="icon" href="shared/icons/tools.svg" type="image/svg+xml" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
  <main class="mx-auto max-w-4xl px-4 py-12 sm:px-6 sm:py-20" x-data="{ tools: [
    { href: 'pw-generator/index.html', icon: 'key', name: 'パスワード生成', note: '安全なパスワードを作成' },
    { href: 'pdf-converter/index.html', icon: 'pdf', name: 'PDF → PNG 変換', note: 'PDFを高解像度PNGに' },
    { href: 'marp-viewer/index.html', icon: 'slide', name: 'Marp Viewer', note: 'Markdownスライドをプレビュー' },
    { href: 'schedule-listing/', icon: 'calendar', name: '日程候補リスト作成', note: '週表示からドラッグで候補日程を作成' },
    { href: 'file-shareing/', icon: 'cloud', name: 'ファイル共有', note: 'アップロードしてURLを発行' },
    { href: 'degital-card/', icon: 'card', name: 'デジタルめいし', note: 'QRコードで共有できるプロフィールカード' },
    { href: 'waroka/frontend/', icon: 'receipt', name: 'ワロカ', note: 'シンプルな割り勘' },
    { href: 'redirect/console', icon: 'redirect', name: 'リダイレクト設定', note: 'QRコードの転送先URLを変更' },
    { href: 'https://dify-playground.ai-digitax.com/chat/uvUG6K5wVRH7dCtC', icon: 'chat', name: '会話の追体験', note: '過去の会話をたどる', ext: true },
  ] }">
    <h1 class="mb-8 flex items-center gap-3 text-3xl font-semibold tracking-tight sm:mb-10">
      <img src="shared/icons/tools.svg" alt="" class="h-10 w-10" />Tools
    </h1>

    <ul class="grid grid-cols-3 gap-3 sm:gap-5">
      <template x-for="t in tools" :key="t.href">
        <li>
          <a :href="t.href" :target="t.ext ? '_blank' : null" :rel="t.ext ? 'noopener' : null"
            class="relative flex h-full flex-col items-center gap-2 rounded-2xl bg-white px-2 py-5 text-center ring-1 ring-slate-200 transition hover:-translate-y-0.5 hover:shadow-lg sm:gap-3 sm:px-4 sm:py-7">
            <img :src="'shared/icons/' + t.icon + '.svg'" alt="" class="h-14 w-14 sm:h-16 sm:w-16" />
            <span class="text-xs font-medium sm:text-base" x-text="t.name"></span>
            <span class="hidden text-sm text-slate-500 sm:block" x-text="t.note"></span>
            <i x-show="t.ext" class="fa-solid fa-arrow-up-right-from-square absolute right-3 top-3 text-xs text-slate-300"></i>
          </a>
        </li>
      </template>
    </ul>
  </main>
</body>
</html>
