<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f172a" />
  <title>Common Tools</title>
  <link rel="icon" href="favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
  <main class="mx-auto max-w-xl px-6 py-20">
    <h1 class="mb-10 text-3xl font-semibold tracking-tight">Tools</h1>

    <ul class="overflow-hidden rounded-2xl bg-white ring-1 ring-slate-200">
      <li>
        <a href="pw-generator/index.html"

          <span class="flex h-11 w-11 items-center justify-center rounded-xl bg-blue-500 text-white">
            <i class="fa-solid fa-key"></i>
          </span>
          <span class="flex-1">
            <span class="block text-base font-medium">パスワード生成</span>
            <span class="block text-sm text-slate-500">安全なパスワードを作成</span>
          </span>
          <i class="fa-solid fa-chevron-right text-slate-300"></i>
        </a>
      </li>

          class="flex items-center gap-4 px-6 py-5 transition hover:bg-slate-50">
          <span class="flex h-11 w-11 items-center justify-center rounded-xl bg-teal-600 text-white">
            <i class="fa-solid fa-file-pdf"></i>
          </span>
          <span class="flex-1">
            <span class="block text-base font-medium">PDF → PNG 変換</span>
            <span class="block text-sm text-slate-500">PDFを高解像度PNGに</span>
          </span>

            <i class="fa-solid fa-display"></i>

            <span class="block text-base font-medium">Marp Viewer</span>

      </li>
      <li class="border-t border-slate-200">
        <a href="schedule-listing/"

          <span class="flex h-11 w-11 items-center justify-center rounded-xl bg-indigo-500 text-white">
            <i class="fa-solid fa-calendar-days"></i>
          </span>
          <span class="flex-1">
            <span class="block text-base font-medium">日程候補リスト作成</span>

          </span>
          <i class="fa-solid fa-chevron-right text-slate-300"></i>
        </a>
      </li>
      <li class="border-t border-slate-200">
        <a href="file-shareing/"
          class="flex items-center gap-4 px-6 py-5 transition hover:bg-slate-50">
          <span class="flex h-11 w-11 items-center justify-center rounded-xl bg-sky-600 text-white">
            <i class="fa-solid fa-share-nodes"></i>
          </span>
          <span class="flex-1">
            <span class="block text-base font-medium">ファイル共有</span>
            <span class="block text-sm text-slate-500">アップロードしてURLを発行</span>
          </span>
          <i class="fa-solid fa-chevron-right text-slate-300"></i>

          </span>
          <span class="flex-1">
            <span class="block text-base font-medium">会話の追体験</span>
            <span class="block text-sm text-slate-500">過去の会話をたどる</span>
          </span>
          <i class="fa-solid fa-arrow-up-right-from-square text-slate-300"></i>
