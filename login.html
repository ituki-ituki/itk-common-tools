<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#fafaf9" />
  <meta name="robots" content="noindex" />
  <title>ログイン</title>
  <link rel="icon" href="/imgs/tools.svg" type="image/svg+xml" />
  <style>
    *{box-sizing:border-box;margin:0}
    body{min-height:100vh;display:grid;place-items:center;background:#fafaf9;color:#292524;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased;padding:1.25rem}
    form{width:100%;max-width:22rem;background:#fff;border:1px solid #e7e5e4;border-radius:1.25rem;padding:2rem 1.5rem}
    header{display:flex;align-items:center;gap:.75rem;margin-bottom:1.75rem}
    h1{font-size:1.125rem;font-weight:600}
    label{display:block;margin-top:1rem;font-size:.8rem;color:#57534e}
    input{display:block;width:100%;margin-top:.35rem;padding:.7rem .85rem;border:1px solid #e7e5e4;border-radius:.75rem;background:#fafaf9;font:inherit;font-size:1rem;color:inherit;outline:none}
    input:focus{border-color:#a8a29e;background:#fff}
    button{width:100%;margin-top:1.5rem;padding:.8rem;border:0;border-radius:.75rem;background:#292524;color:#fff;font:inherit;font-weight:600;cursor:pointer}
    button:disabled{opacity:.5}
    p{min-height:1.25rem;margin-top:.9rem;font-size:.8rem;color:#e11d48;text-align:center}
  </style>
</head>
<body>
  <form id="f">
    <header><img src="/imgs/tools.svg" alt="" width="32" height="32" /><h1>ログイン</h1></header>
    <label>メールアドレス<input name="email" type="email" autocomplete="username" required autofocus /></label>
    <label>パスワード<input name="password" type="password" autocomplete="current-password" required /></label>
    <button>ログイン</button>
    <p id="msg" role="alert"></p>
  </form>
  <script>
    const q = location.search, i = q.indexOf('return_url='), raw = i < 0 ? '/' : decodeURIComponent(q.slice(i + 11))
    const back = raw.startsWith('/') && !raw.startsWith('//') ? raw : '/'
    const f = document.getElementById('f'), msg = document.getElementById('msg')
    f.addEventListener('submit', async (e) => {
      e.preventDefault()
      f.querySelector('button').disabled = true
      msg.textContent = ''
      const r = await fetch('/gate/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.fromEntries(new FormData(f))) }).catch(() => null)
      if (r?.ok) return location.replace(back)
      msg.textContent = (await r?.json().catch(() => null))?.detail || 'ログインできませんでした'
      f.querySelector('button').disabled = false
    })
  </script>
</body>
</html>
