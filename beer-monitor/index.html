<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fb923c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="ビール" />
  <title>ビール残量モニター</title>
  <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials" />
  <link rel="icon" href="../shared/icons/beer.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="../shared/base.js" data-soft="#fff7ed" data-accent="#f97316" data-deep="#c2410c"></script>
  <script src="app.js"></script>
  <style>
    body { font-family: 'M PLUS Rounded 1c', sans-serif; }
    .bubble { position: fixed; bottom: -40px; border-radius: 9999px; background: #fdba7466; animation: rise linear infinite; }
    @keyframes rise { to { transform: translateY(-110vh) translateX(20px); opacity: 0; } }
    .bob { animation: bob 2.4s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-10px) rotate(-4deg); } }
    .spot { border: 3px solid var(--c); box-shadow: 0 0 0 2px #fff9; }
    .pop { animation: pop .5s cubic-bezier(.3, 1.6, .5, 1) both; }
    @keyframes pop { from { transform: scale(0); } }
    .pour { animation: pour 2.4s ease-in-out infinite; }
    @keyframes pour { 0% { height: 0; } 75%, 100% { height: 80%; } }
    .fizz { position: absolute; bottom: 0; border-radius: 9999px; background: #fff9; animation: fizz 1.2s ease-in infinite; }
    @keyframes fizz { to { transform: translateY(-70px); opacity: 0; } }
  </style>
</head>
<body class="min-h-screen overflow-x-hidden bg-soft text-ink antialiased">
  <div x-data aria-hidden="true">
    <template x-for="i in 10" :key="i">
      <span class="bubble" :style="`left:${i * 10 - 5}%;width:${10 + (i % 4) * 8}px;height:${10 + (i % 4) * 8}px;animation-duration:${8 + (i % 5) * 2}s;animation-delay:${i * -1.3}s`"></span>
    </template>
  </div>

  <main class="relative mx-auto max-w-md px-4 pb-40 pt-8" x-data="monitor()">
    <h1 class="mb-6 flex items-center justify-center gap-2 text-2xl font-extrabold text-orange-500">
      <img src="../shared/icons/beer.svg" alt="" class="h-10 w-10" />ビール残量モニター
    </h1>

    <section x-show="state === 'idle'" class="mt-10 text-center">
      <img src="../shared/icons/beer.svg" alt="" class="bob mx-auto mb-8 h-40 w-40 drop-shadow-xl" />
      <p class="text-2xl font-extrabold">ビールを撮ってね！</p>
      <p class="mt-2 text-sm text-mute">みんなの空きグラスを、見逃さないよ</p>
    </section>

    <section x-show="state !== 'idle'" x-cloak>
      <div class="relative mx-auto w-fit max-w-full overflow-hidden rounded-3xl bg-white shadow-xl ring-4 ring-white">
        <img :src="photo" alt="" class="block max-h-[calc(100dvh-16rem)] max-w-full" />
        <template x-for="it in items" :key="it.n">
          <div class="spot absolute rounded-2xl" :style="spot(it)">
            <div class="absolute left-1/2 -translate-x-1/2" :class="it.box[0] < 120 ? 'top-2' : '-top-3 -translate-y-full'">
              <div class="pop relative whitespace-nowrap rounded-2xl px-3 py-1.5 text-lg font-extrabold text-white shadow-lg" :style="`background:${it.color};animation-delay:${it.n * 0.12}s`">
                <span x-text="it.text"></span>
                <span class="absolute -bottom-1.5 left-1/2 -z-10 h-3 w-3 -translate-x-1/2 rotate-45" :style="`background:${it.color}`"></span>
              </div>
            </div>
          </div>
        </template>
        <div x-show="state === 'busy'" class="absolute inset-0 flex flex-col items-center justify-center gap-5 bg-orange-400/60 backdrop-blur-sm">
          <div class="relative h-28 w-20">
            <div class="absolute inset-0 overflow-hidden rounded-b-3xl rounded-t-lg border-[6px] border-white bg-white/30">
              <div class="pour absolute inset-x-0 bottom-0 bg-gradient-to-t from-amber-500 to-amber-300">
                <div class="absolute -inset-x-2 -top-3 h-6 rounded-full bg-white"></div>
                <template x-for="i in 4" :key="i">
                  <span class="fizz" :style="`left:${i * 20 - 8}%;width:${4 + (i % 2) * 3}px;height:${4 + (i % 2) * 3}px;animation-delay:${i * 0.3}s`"></span>
                </template>
              </div>
            </div>
            <div class="absolute -right-6 top-6 h-12 w-7 rounded-r-2xl border-[6px] border-l-0 border-white"></div>
          </div>
          <p class="text-lg font-extrabold text-white drop-shadow">のこり、はかってるよ…</p>
        </div>
      </div>

      <p x-show="state === 'error'" class="mt-5 rounded-2xl bg-rose-50 p-4 text-center text-sm font-medium text-rose-600" x-text="error"></p>
      <p x-show="state === 'done'" class="mt-4 text-center text-lg font-extrabold"
        x-text="items.length ? items.length + 'つ みつけた！' : 'ビールが見つからなかったよ…'"></p>
    </section>

    <nav class="fixed inset-x-0 bottom-0 flex items-end justify-center gap-6 bg-gradient-to-t from-soft via-soft/90 to-transparent pb-[max(1.5rem,env(safe-area-inset-bottom))] pt-10">
      <label class="flex h-14 w-14 cursor-pointer items-center justify-center rounded-full bg-white text-xl text-orange-400 shadow-lg" title="アルバムから選ぶ">
        <input type="file" accept="image/*" class="hidden" @change="shoot($event)" :disabled="state === 'busy'" />
        <i class="fa-solid fa-image"></i>
      </label>
      <label class="flex h-20 w-20 cursor-pointer items-center justify-center rounded-full bg-gradient-to-br from-orange-400 to-rose-500 text-3xl text-white shadow-xl ring-8 ring-white transition active:scale-90"
        :class="state === 'busy' && 'pointer-events-none opacity-60'" title="撮影">
        <input type="file" accept="image/*" capture="environment" class="hidden" @change="shoot($event)" />
        <i class="fa-solid fa-camera"></i>
      </label>
      <span class="w-14"></span>
    </nav>
  </main>
</body>
</html>
