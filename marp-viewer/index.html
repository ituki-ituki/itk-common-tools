<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marp Viewer</title>
  <link rel="icon" href="template/favicon.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <header>
    <div class="brand">
      <img src="template/favicon.png" alt="Marp Viewer" class="logo" style="height: 2em; vertical-align: middle;">
      <h1 style="display: inline-block; vertical-align: middle; line-height: 2em; margin: 0 0 0 0.5em;">Marp Viewer</h1>
    </div>
    <div class="toolbar">
      <div class="toolbar-group">
        <select id="editorMode" aria-label="Markdown または CSS">
          <option value="md">Markdown</option>
          <option value="css">CSS</option>
        </select>
        <button id="resetBtn" type="button" title="再読み込み" aria-label="再読み込み">
          <i class="fa-solid fa-rotate-right" aria-hidden="true"></i>
        </button>
      </div>
      <span class="spacer"></span>
      <div class="toolbar-actions">
        <a
          id="aiBtn"
          class="toolbar-btn"
          href="https://dify.ituki-ituki.com/workflow/a0LSfdRlSp8HWwmv"
          target="_blank"
          rel="noopener noreferrer"
        >
          <i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i>
          AI生成
        </a>
        <button id="pdfBtn" type="button">
          <i class="fa-solid fa-file-pdf" aria-hidden="true"></i>
          PDF出力
        </button>
      </div>
    </div>
  </header>

  <main>
    <textarea id="editor" spellcheck="false"></textarea>
    <div id="preview"></div>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
