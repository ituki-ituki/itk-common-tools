<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="納品書" />
  <title>納品書 → 販売王</title>
  <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="/vendor/tw.css?v=3" />
  <script defer src="/vendor/alpine.min.js"></script>
  <script src="/base.js?v=2" data-soft="#f7f7f7" data-accent="#005b9d" data-deep="#00375f"></script>
  <script src="item.js?v=3"></script>
  <script src="app.js?v=5"></script>
  <style>
    .mincho { font-family: 'Noto Serif JP', 'Hiragino Mincho ProN', 'Yu Mincho', serif; }
    input[type=number]::-webkit-inner-spin-button { display: none; }
    .sweep { animation: sweep 1.6s ease-in-out infinite alternate; }
    @keyframes sweep { from { top: 0; } to { top: calc(100% - 2px); } }
    .shimmer { background: linear-gradient(90deg, #eee 25%, #f7f7f7 50%, #eee 75%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
    @keyframes shimmer { to { background-position: -200% 0; } }
  </style>
</head>
<body class="min-h-screen select-none bg-soft text-[#333] antialiased" x-data="scanner()">
  <header class="sticky top-0 z-10 flex items-center border-b border-[#ddd] bg-white px-5 pb-6 pt-[max(1.5rem,env(safe-area-inset-top))]">
    <h1 class="mincho flex items-center gap-3 text-xl tracking-[0.2em] text-accent"><i class="fa-solid fa-wine-glass mr-1 text-[22px]"></i><span class="mr-1 h-5 w-px bg-[#ddd]"></span>納品書<i class="fa-solid fa-angles-right text-xs text-[#ccc]"></i>販売王</h1>
    <button @click="logout" class="ml-auto text-[#999] active:text-accent" aria-label="ログアウト"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
  </header>

  <main x-show="step === 'scan'" class="mx-auto max-w-2xl space-y-6 px-4 py-6 pb-36">
    <div x-show="!slips.length" class="flex flex-col items-center gap-3 py-32 text-[#ccc]">
      <i class="fa-regular fa-file-lines text-4xl"></i>
      <p class="mincho text-sm tracking-[0.2em]">納品書をスキャンしてください</p>
    </div>

    <template x-for="(slip, i) in slips" :key="slip.id">
      <section class="border border-[#ddd] bg-white">
        <div class="flex items-center gap-3 px-4 py-3">
          <span class="mincho text-2xl text-accent" x-text="String(i + 1).padStart(2, '0')"></span>
          <select x-show="slip.state === 'done'" x-model="slip.supplier_code" @change="$event.target.value === '__new__' && addSupplier(slip)" class="min-w-0 flex-1 bg-transparent text-base outline-none">
            <option value="">仕入先</option>
            <option value="__new__">＋ 仕入先を追加</option>
            <template x-for="s in suppliers" :key="s.code"><option :value="s.code" x-text="s.name" :selected="s.code === slip.supplier_code"></option></template>
          </select>
          <span x-show="slip.state === 'busy'" class="flex-1 text-[10px] tracking-[0.3em] text-accent">ANALYZING</span>
          <span x-show="slip.state === 'error'" class="flex-1 text-xs text-red-600" x-text="slip.message"></span>
          <input x-show="slip.state === 'done'" type="date" x-model="slip.date" class="w-32 bg-transparent text-sm text-mute outline-none" />
        </div>

        <div x-show="slip.state === 'busy'" class="border-t border-[#eee] p-4">
          <div class="relative mb-4 h-40 overflow-hidden bg-[#eee]">
            <img :src="slip.photo" x-show="slip.photo" class="h-full w-full object-cover opacity-60 blur-[1px]" />
            <div class="sweep absolute inset-x-0 h-0.5 bg-accent shadow-[0_0_12px_2px_#005b9d88]"></div>
          </div>
          <template x-for="k in 3"><div class="mb-3 space-y-2"><div class="shimmer h-3 w-3/4"></div><div class="shimmer h-2 w-1/2"></div></div></template>
        </div>

        <div x-show="slip.state === 'done'" class="border-t border-[#eee]">
          <template x-for="line in slip.lines" :key="line.n">
            <div class="border-b border-[#eee] px-4 py-3 last:border-b-0">
              <div class="flex items-start gap-2">
                <p class="flex-1 text-sm font-medium" x-text="line.fee ? '送料' : wine(line.code) || line.name"></p>
                <span x-show="!line.fee && !line.code" class="mt-0.5 bg-accent px-1.5 py-0.5 text-[10px] tracking-widest text-white">新規</span>
                <button x-show="!line.fee" @click="open(line)" class="shrink-0 border border-[#ddd] px-2 py-0.5 text-[11px] text-mute">変更</button>
                <button @click="slip.lines = slip.lines.filter((l) => l !== line)" class="shrink-0 px-1 text-[#ccc]" aria-label="行を削除"><i class="fa-solid fa-xmark text-xs"></i></button>
              </div>
              <p class="mt-0.5 truncate text-[11px] text-[#999]" x-text="line.name"></p>
              <div class="mt-2 flex items-center gap-1 text-base tabular-nums">
                <input type="number" inputmode="numeric" x-model.number="line.price" class="w-20 border-b border-[#eee] bg-transparent text-right outline-none focus:border-accent" />
                <span class="text-[#ccc]">×</span>
                <input type="number" inputmode="numeric" x-model.number="line.qty" class="w-10 border-b border-[#eee] bg-transparent text-right outline-none focus:border-accent" />
                <span class="text-[#ccc]">=</span>
                <input type="number" inputmode="numeric" x-model.number="line.amount" class="ml-auto w-24 border-b border-[#eee] bg-transparent text-right font-medium outline-none focus:border-accent" />
              </div>
            </div>
          </template>
          <ul x-show="warns(slip).length" class="space-y-1 border-t border-[#eee] px-4 py-3 text-xs text-amber-700">
            <template x-for="w in warns(slip)"><li><i class="fa-solid fa-circle-exclamation mr-1.5"></i><span x-text="w"></span></li></template>
          </ul>
        </div>
      </section>
    </template>
    <p x-show="error" class="text-center text-xs text-red-600" x-text="error"></p>
  </main>

  <div x-show="picking" x-transition.opacity class="fixed inset-0 z-30 bg-black/30" @click="picking = null"></div>
  <div x-show="picking" x-transition:enter="transition duration-200" x-transition:enter-start="translate-y-full" class="fixed inset-x-0 bottom-0 z-40 flex max-h-[75vh] flex-col bg-white pb-[env(safe-area-inset-bottom)]">
    <div class="border-b border-[#eee] p-4">
      <p class="mb-2 truncate text-[11px] text-[#999]" x-text="picking?.name"></p>
      <input x-ref="query" x-model="query" placeholder="検索" class="w-full border-b border-accent pb-1 text-base outline-none" />
    </div>
    <ul class="flex-1 overflow-y-auto text-sm">
      <li class="cursor-pointer border-b border-[#eee] px-4 py-3 text-accent active:bg-soft" @click="choose(null)"><i class="fa-solid fa-plus mr-2"></i>新規商品にする</li>
      <template x-for="w in hits()" :key="w.code">
        <li class="cursor-pointer border-b border-[#eee] px-4 py-3 active:bg-soft" :class="w.code === picking?.code && 'text-accent'" @click="choose(w.code)" x-text="w.name"></li>
      </template>
    </ul>
  </div>

  <div x-show="adding" x-transition.opacity class="fixed inset-0 z-30 bg-black/30" @click="adding = null"></div>
  <form x-show="adding" @submit.prevent="saveSupplier" x-transition:enter="transition duration-200" x-transition:enter-start="translate-y-full" class="fixed inset-x-0 bottom-0 z-40 space-y-4 bg-white p-5 pb-[max(1.25rem,env(safe-area-inset-bottom))]">
    <p class="mincho text-sm tracking-[0.2em] text-accent">仕入先を追加</p>
    <input x-model="draft.code" placeholder="販売王の仕入先コード" inputmode="numeric" class="w-full border-b border-[#ddd] pb-1 text-base outline-none focus:border-accent" />
    <input x-model="draft.name" placeholder="名前" class="w-full border-b border-[#ddd] pb-1 text-base outline-none focus:border-accent" />
    <p x-show="draft.error" class="text-xs text-red-600" x-text="draft.error"></p>
    <button class="w-full bg-accent py-3 text-sm tracking-[0.2em] text-white">保存</button>
  </form>

  <main x-show="step === 'master'" class="mx-auto max-w-2xl space-y-6 px-4 py-6 pb-36">
    <div class="flex items-baseline justify-between">
      <p class="mincho text-sm tracking-[0.2em] text-accent">新規商品の登録 <span x-text="news.length"></span>件</p>
    </div>
    <template x-for="line in news" :key="line.n + line.name">
      <section x-show="line.draft" class="space-y-3 border border-[#ddd] bg-white p-4">
        <p class="text-[10px] text-[#999]"><span x-show="line.draft?.loading"><i class="fa-solid fa-spinner fa-spin mr-1"></i>AI下書き中 ・ </span>原単価 <span x-text="line.price"></span></p>
        <template x-for="[key, label] in [['name', '商品名'], ['kana', 'フリガナ'], ['short', '略称'], ['initial_kana', 'イニシャル カナ'], ['initial_en', 'イニシャル 英字']]">
          <label class="block text-[10px] tracking-wider text-[#999]"><span x-text="label"></span>
            <input x-model="line.draft[key]" class="block w-full border-b border-[#eee] pb-1 text-base text-[#333] outline-none focus:border-accent" />
          </label>
        </template>
        <div class="grid grid-cols-3 gap-3">
          <template x-for="[key, label] in [['retail', '上代'], ['price', '標準売値'], ['price1', '売値1']]">
            <label class="block text-[10px] tracking-wider text-[#999]"><span x-text="label"></span>
              <input x-model.number="line.draft[key]" type="number" inputmode="numeric" class="block w-full border-b border-[#ddd] pb-1 text-right text-base text-[#333] outline-none focus:border-accent" />
            </label>
          </template>
        </div>
      </section>
    </template>
    <p x-show="error" class="text-center text-xs text-red-600" x-text="error"></p>
  </main>

  <footer class="fixed inset-x-0 bottom-0 grid grid-cols-2 border-t border-[#ddd] bg-white pb-[env(safe-area-inset-bottom)] text-sm tracking-[0.2em]">
    <button x-show="step === 'master'" class="flex items-center justify-center gap-2 py-5 text-mute active:bg-soft" @click="step = 'scan'"><i class="fa-solid fa-arrow-left"></i>戻る</button>
    <label x-show="step === 'scan'" class="flex cursor-pointer items-center justify-center gap-2 py-5 text-accent active:bg-soft">
      <i class="fa-solid fa-camera"></i>SCAN
      <input type="file" accept="image/*" capture="environment" multiple class="hidden" @change="shoot" />
    </label>
    <button class="flex items-center justify-center gap-2 bg-accent py-5 text-white disabled:bg-[#ccc]" :disabled="!ready" @click="go">
      <template x-if="step === 'scan' && news.length"><span>次へ<i class="fa-solid fa-arrow-right ml-2"></i></span></template>
      <template x-if="step === 'master' || !news.length"><span><i class="fa-solid fa-arrow-down mr-2"></i>CSV</span></template>
      <span x-show="busy" class="text-xs" x-text="`(${busy})`"></span>
    </button>
  </footer>
</body>
</html>
