<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>納品書 → 販売王</title>
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="/vendor/tw.css" />
  <script defer src="/vendor/alpine.min.js"></script>
  <script src="/base.js?v=2" data-soft="#f7f7f7" data-accent="#005b9d" data-deep="#00375f"></script>
  <script src="app.js"></script>
  <style>
    .mincho { font-family: 'Noto Serif JP', 'Hiragino Mincho ProN', 'Yu Mincho', serif; }
    input[type=number]::-webkit-inner-spin-button { display: none; }
  </style>
</head>
<body class="min-h-screen bg-soft text-[#333] antialiased" x-data="scanner()">
  <header class="sticky top-0 z-10 flex items-baseline justify-between border-b border-[#ddd] bg-white px-5 py-4">
    <h1 class="mincho flex items-center gap-3 text-lg tracking-[0.2em] text-accent">納品書<i class="fa-solid fa-angles-right text-xs text-[#ccc]"></i>販売王</h1>
    <span class="text-[10px] tracking-[0.3em] text-mute">SCAN</span>
  </header>

  <main class="mx-auto max-w-2xl space-y-6 px-4 py-6 pb-32">
    <div x-show="!slips.length" class="flex flex-col items-center gap-3 py-32 text-[#ccc]">
      <i class="fa-regular fa-file-lines text-4xl"></i>
      <p class="mincho text-xs tracking-[0.3em]">NO SLIPS</p>
    </div>

    <template x-for="(slip, i) in slips" :key="slip.id">
      <section class="border border-[#ddd] bg-white">
        <div class="flex items-center gap-3 px-4 py-3">
          <span class="mincho text-2xl text-accent" x-text="String(i + 1).padStart(2, '0')"></span>
          <select x-show="slip.state === 'done'" x-model="slip.supplier_code" class="min-w-0 flex-1 bg-transparent text-sm outline-none">
            <option value="">仕入先</option>
            <template x-for="s in suppliers" :key="s.code"><option :value="s.code" x-text="s.name" :selected="s.code === slip.supplier_code"></option></template>
          </select>
          <span x-show="slip.state !== 'done'" class="flex-1"></span>
          <input x-show="slip.state === 'done'" type="date" x-model="slip.date" class="w-28 bg-transparent text-xs text-mute outline-none" />
          <button class="text-[#ccc] hover:text-mute" @click="drop(slip)"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div x-show="slip.state === 'busy'" class="h-0.5 overflow-hidden bg-[#eee]"><div class="h-full w-1/3 animate-pulse bg-accent"></div></div>
        <p x-show="slip.state === 'error'" class="px-4 pb-4 text-xs text-red-600" x-text="slip.message"></p>

        <div x-show="slip.state === 'done'" class="border-t border-[#eee]">

          <template x-for="line in slip.lines" :key="line.n">
            <div class="border-b border-[#eee] px-4 py-3 last:border-b-0" :class="!line.fee && !line.code && 'bg-red-50'">
              <div x-show="!line.fee" class="relative" @click.outside="line.open = false">
                <button class="flex w-full items-start gap-2 text-left" @click="line.open = !line.open">
                  <span class="flex-1 text-sm font-medium" :class="!line.code && 'text-red-600'" x-text="wine(line.code) || '未選択'"></span>
                  <span x-show="line.by" class="mt-0.5 text-[10px] tracking-widest text-accent" x-text="{ ai: 'AI', learned: 'AUTO', manual: '' }[line.by]"></span>
                  <i class="fa-solid fa-chevron-down mt-1 text-[10px] text-[#ccc]"></i>
                </button>
                <div x-show="line.open" x-transition.opacity class="absolute inset-x-0 z-20 mt-2 border border-[#ddd] bg-white">
                  <input x-model="line.query" placeholder="検索" class="w-full border-b border-[#eee] px-3 py-2 text-sm outline-none" />
                  <ul class="max-h-60 overflow-y-auto text-sm">
                    <li class="cursor-pointer px-3 py-2 text-mute hover:bg-soft" @click="choose(line, '__skip__')">スキップ</li>
                    <template x-for="w in hits(line)" :key="w.code">
                      <li class="cursor-pointer px-3 py-2 hover:bg-soft" @click="choose(line, w.code)" x-text="w.name"></li>
                    </template>
                  </ul>
                </div>
              </div>
              <p x-show="line.fee" class="text-sm font-medium">送料</p>
              <p class="mt-0.5 truncate text-[11px] text-[#999]" x-text="line.name"></p>
              <div class="mt-2 flex items-center gap-1 text-sm tabular-nums">
                <input type="number" x-model.number="line.price" class="w-20 border-b border-[#eee] bg-transparent text-right outline-none focus:border-accent" />
                <span class="text-[#ccc]">×</span>
                <input type="number" x-model.number="line.qty" class="w-10 border-b border-[#eee] bg-transparent text-right outline-none focus:border-accent" />
                <span class="text-[#ccc]">=</span>
                <input type="number" x-model.number="line.amount" class="ml-auto w-24 border-b border-[#eee] bg-transparent text-right font-medium outline-none focus:border-accent" />
              </div>
            </div>
          </template>

          <ul x-show="warns(slip).length" class="space-y-1 border-t border-[#eee] px-4 py-3 text-xs text-amber-700">
            <template x-for="w in warns(slip)"><li><i class="fa-solid fa-circle-exclamation mr-1.5"></i><span x-text="w"></span></li></template>
          </ul>
        </div>
      </section>
    </template>
    <p x-show="error" class="text-center text-xs text-red-600" x-text="error"></p>
  </main>

  <footer class="fixed inset-x-0 bottom-0 grid grid-cols-2 border-t border-[#ddd] bg-white text-sm tracking-[0.2em]">
    <label class="flex cursor-pointer items-center justify-center gap-2 py-5 text-accent">
      <i class="fa-solid fa-camera"></i>SCAN
      <input type="file" accept="image/*" capture="environment" multiple class="hidden" @change="shoot" />
    </label>
    <button class="flex items-center justify-center gap-2 bg-accent py-5 text-white disabled:bg-[#ccc]" :disabled="!ready" @click="save">
      <i class="fa-solid fa-arrow-down"></i>CSV<span x-show="busy" class="text-xs" x-text="`(${busy})`"></span>
    </button>
  </footer>
</body>
</html>
